<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habibi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#352b1d}
.hb-app{width:100%;max-width:1180px;margin:auto;position:relative;overflow:hidden;background:#fff}
.hb-app>img{display:block;width:100%;height:auto}
/* SADECE GERÇEK FAL İKONLARININ ÜZERİNDE TIKLAMA ALANI */
.hb-hotspot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;z-index:20}
.hb-credit{position:absolute;left:16%;top:35.4%;z-index:30;background:#fff;padding:3px 10px;font:700 29px Arial;border-radius:6px;color:#352b1d}
#hbModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:99999;align-items:flex-end;justify-content:center}
#hbModal.show{display:flex}
.hb-sheet{width:min(100%,560px);background:#fff;border-radius:25px 25px 0 0;padding:18px;max-height:92vh;overflow:auto}
.hb-close{float:right;border:0;background:none;font-size:31px;cursor:pointer}
.hb-title{text-align:center;margin:4px 35px 8px;font:700 22px Georgia,serif}
.hb-sub{text-align:center;color:#777;font-size:13px;margin:8px 0 15px;line-height:1.4}
.hb-form{display:grid;gap:10px}
.hb-form input,.hb-form select,.hb-form textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:14px}
.hb-form textarea{height:95px;resize:none}
.hb-upload{height:128px;border:2px dashed #d8aa2a;border-radius:17px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;cursor:pointer;font-weight:bold;color:#6a5323}
.hb-plus{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#e0ac20;color:white;font-size:36px}
.hb-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hb-preview img{width:100%;height:95px;object-fit:cover;border-radius:10px}
.hb-selected-wrap{margin:8px 0 12px}
.hb-selected-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.hb-slot{height:108px;border:2px dashed #ead49b;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fffdf8;color:#3d3326;font-weight:700;overflow:hidden}
.hb-slot .plus{font-size:48px;line-height:1;color:#dfa91b;font-weight:400}
.hb-card-title-row{display:flex;justify-content:space-between;align-items:center;margin:13px 0 8px;font-weight:700}
.hb-card-count{font-size:16px}
.hb-cards{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;max-height:420px;overflow:auto;padding:4px}
.hb-card{aspect-ratio:72/106;border:0;border-radius:6px;cursor:pointer;position:relative;overflow:hidden;

<div id="hbFortunes"><div class="hbf-wrap"><button class="hbf-back" id="hbfBack">← Geri</button><h1 class="hbf-title">Yorumlanan Fallarım</h1><div id="hbfList"></div></div></div>

<script>

// FALLARIM: yorumlanan fallar penceresi
const hbFortunesBtn=document.getElementById('hbFortunesBtn');
const hbFortunes=document.getElementById('hbFortunes');
const hbfBack=document.getElementById('hbfBack');
const hbfList=document.getElementById('hbfList');
const hbSampleFortunes=[];
function hbRenderFortunes(){
 const saved=JSON.parse(localStorage.getItem('habibi_fortunes')||'null');
 const items=saved&&saved.length?saved:[];
 hbfList.innerHTML=items.length?items.map(x=>`<div class="hbf-card"><div class="hbf-icon">${x.icon||'🔮'}</div><div><b>${x.title||'Fal'}</b><span>${x.date||'Yorumun hazır'}</span></div><div class="hbf-badge">${x.status||'YORUMLANDI'}</div></div>`).join(''):'<div class="hbf-empty">Henüz yorumlanan falın yok. Fal gönderdiğinde yorumların burada görünecek. 🔮</div>';
}
hbFortunesBtn?.addEventListener('click',()=>{hbRenderFortunes();hbFortunes.classList.add('show');window.scrollTo(0,0)});
hbfBack?.addEventListener('click',()=>hbFortunes.classList.remove('show'));

const hbConfig={
 coffee:{title:'Kahve Falı',photos:3,question:true,info:true},
 tarot:{title:'Tarot Falı',cards:78,question:true,info:true},
 katina:{title:'Katina Falı',cards:65,question:true,info:true},
 dream:{title:'Rüya Yorumu',question:true},
 palm:{title:'El Falı',photos:3},
 numerology:{title:'Numeroloji',birth:true,question:true},
 face:{title:'Yüz Falı',photos:1,question:true},
 life:{title:'Yaşam Koçu',question:true},
 relationship:{title:'İlişki Danışmanı',photos:1,question:true},
 astrology:{title:'Astroloji',birth:true,question:true}
};
let hbMode='', hbSelected=[], hbFiles=[];

function hbInfo(){
 return `<input placeholder="Ad / İsim">
 <select><option value="">İlişki durumu seç</option><option>Bekar</option><option>İlişkisi Var</option><option>Evli</option><option>Ayrılmış</option></select>
 <input type="number" min="1" max="120" placeholder="Yaş">
 <input placeholder="Şehir">`;
}
function hbOpen(mode){
 const c=hbConfig[mode]; if(!c) return;
 hbMode=mode; hbSelected=[]; hbFiles=[];
 document.getElementById('hbTitle').textContent=c.title;
 let body=`<p class="hb-sub">`;
 if(c.cards) body+=`Lütfen 7 kart seçiniz. Kart isimleri ve numaraları görünmez.`;
 else if(c.photos) body+=`En fazla ${c.photos} fotoğraf gönderebilirsin.`;
 else body+='Bilgilerini doldur ve talebini gönder.';
 body+=`</p><div class="hb-form">`;

 if(c.cards){
   const pickCount=7;
   let slotsHtml='';
   for(let n=1;n<=pickCount;n++){
     slotsHtml+=`<div class="hb-slot"><span>${n}. Kart</span><span class="plus">+</span></div>`;
   }
   body+=`
     <div class="hb-selected-wrap">
       <div class="hb-selected-slots" id="hbSlots">${slotsHtml}</div>
     </div>
     <div class="hb-card-title-row">
       <span>Kartları Seç</span>
       <span class="hb-card-count" id="hbCount">0 / 7</span>
     </div>
     <div class="hb-cards" id="hbCards"></div>
     <div class="hb-card-info">ⓘ Kartlara dokunarak seçim yapabilirsin.</div>
     <button type="button" class="hb-continue" id="hbContinue" disabled>DEVAM ET</button>`;
 }
 if(c.photos) body+=`<input id="hbPhotos" type="file" accept="image/*" multiple hidden>
 <label for="hbPhotos" class="hb-upload"><span class="hb-plus">+</span><span>Fotoğraf Seç</span></label>
 <div class="hb-preview" id="hbPreview"></div>`;
 if(c.birth) body+='<input type="date" id="hbBirth" aria-label="Doğum tarihi">';
 if(c.question) body+='<textarea id="hbQuestion" placeholder="Sorunu buraya yaz..."></textarea>';
 if(c.info) body+=hbInfo();
 body+='</div>';

 document.getElementById('hbBody').innerHTML=body;
 const send=document.getElementById('hbSend');
 send.disabled=!!(c.cards||c.photos);
 send.textContent=c.cards?'KART TALEBİNİ GÖNDER':'TALEBİ GÖNDER';
 document.getElementById('hbStatus').textContent='';
 document.getElementById('hbModal').classList.add('show');

 if(c.cards){
   const grid=document.getElementById('hbCards');
   const pickCount=7;
   const count=document.getElementById('hbCount');
   const slots=document.getElementById('hbSlots');
   const cont=document.getElementById('hbContinue');
   function renderSlots(){
     [...slots.children].forEach((slot,n)=>{
       const chosen=hbSelected[n];
       if(chosen===undefined){
         slot.innerHTML=`<span>${n+1}. Kart</span><span class="plus">+</span>`;
       } else {
         slot.innerHTML=`<span style="font-size:11px;margin:5px 0 2px">${n+1}. Kart</span><div class="hb-mini-card"></div>`;
       }
     });
     count.textContent=`${hbSelected.length} / ${pickCount}`;
     cont.disabled=hbSelected.length!==pickCount;
     cont.classList.toggle('active',hbSelected.length===pickCount);
   }
   for(let i=0;i<c.cards;i++){
     const card=document.createElement('button');card.type='button';card.className='hb-card';
     card.addEventListener('click',()=>{
       const p=hbSelected.indexOf(i);
       if(p>=0){
         hbSelected.splice(p,1);
       } else if(hbSelected.length<pickCount){
         hbSelected.push(i);
       }
       Array.from(grid.children).forEach((item,index)=>{
         item.classList.toggle('sel',hbSelected.includes(index));
       });
       renderSlots();
     });
     grid.appendChild(card);
   }
   cont.onclick=()=>{send.disabled=false;send.scrollIntoView({behavior:'smooth',block:'center'});};
   renderSlots();
 }
 if(c.photos){
   document.getElementById('hbPhotos').addEventListener('change',function(){
     hbFiles=[...this.files].slice(0,c.photos);
     const p=document.getElementById('hbPreview');p.innerHTML='';
     hbFiles.forEach(f=>{const im=document.createElement('img');im.src=URL.createObjectURL(f);p.appendChild(im)});
     send.disabled=hbFiles.length===0;
   });
 }
 send.onclick=()=>{document.getElementById('hbStatus').textContent='Talebin oluşturuldu. Yorumcu havuzuna gönderilmeye hazır.';};
}
document.querySelectorAll('.hb-hotspot').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();hbOpen(b.dataset.mode)}));
document.getElementById('hbClose').onclick=()=>document.getElementById('hbModal').classList.remove('show');
document.getElementById('hbModal').addEventListener('click',e=>{if(e.target.id==='hbModal')document.getElementById('hbModal').classList.remove('show')});
</script>

async function hbLoadReviewersFromSupabase(){
  const SUPABASE_URL = "https://jkvcqyppotvfhrxhopdi.supabase.com";
  const SUPABASE_KEY = "sb_publishable_Jn1jSTBT8Eo2FgELSuia-Q_afAKDx03";
  try{
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/readers?select=id,display_name,bio,specialties,is_online,rating,total_reviews,price_credits&order=rating.desc",
      {
        headers:{
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );
    if(!res.ok) throw new Error("Supabase HTTP " + res.status);
    const rows = await res.json();
    if(Array.isArray(rows) && rows.length){
      hbReviewers = rows.map((r,i)=>({
        id:r.id,
        name:r.display_name || "Habibi Yorumcusu",

        about:r.bio || "Habibi yorumcusu olarak sana rehberlik ediyorum.",
        specialties:Array.isArray(r.specialties)?r.specialties:[],
        online:r.is_online !== false,
        price:r.price_credits || 0,
        avatar:`https://randomuser.me/api/portraits/women/${[44,65,32,79,68,12,23,45,53,37,61,71,28,57,83][i%15]}.jpg`
      }));
      hbRenderReviewerStrip();
    }
  }catch(err){
    console.warn("Yorumcular Supabase'den yüklenemedi; yedek liste gösteriliyor.", err);
    hbRenderReviewerStrip();
  }
}
