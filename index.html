<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Habibi</title>
<style>
:root{--gold:#d9a52a;--line:#eedfb7;--ink:#342a21}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Arial,sans-serif}
body{padding-bottom:60px}
.page{width:100%;max-width:710px;min-width:0;margin:auto;background:#fff}
.top{height:125px;display:flex;align-items:center;justify-content:space-between;padding:25px 17px 0}
.menu{font-size:39px;color:var(--gold);background:none;border:0;line-height:1}
.logo{width:281px;height:87px;object-fit:fill}
.balance{height:45px;min-width:120px;border:1.5px solid var(--gold);border-radius:29px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:18px}
.balancePlus{height:36px;width:36px;border-radius:50%;background:var(--gold);color:#fff;border:0;font-size:30px;line-height:43px}
.hero{width:calc(100% - 46px);height:125px;margin:0 23px;border:1.5px solid var(--gold);border-radius:17px;overflow:hidden;position:relative;background:#fff}
.hero img{display:block;width:100%;height:100%;object-fit:fill}.heroHotspot{position:absolute;right:14px;top:34px;width:170px;height:58px;border:0;background:transparent;cursor:pointer}

.credit{height:70px;margin:13px 23px 16px;border:1.5px solid var(--line);border-radius:17px;display:flex;align-items:center;justify-content:space-between;padding:12px 17px}
.creditText{font-size:14px}.creditNum{font-size:29px;color:var(--gold);font-weight:700}.load{height:38px;min-width:130px;border:1.5px solid var(--gold);border-radius:23px;background:#fff;font-size:14px}
.section{display:flex;justify-content:space-between;align-items:center;padding:0 24px 10px}
.section h2{font:700 22px Georgia,serif;margin:0}.section button{border:0;background:none;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 24px}
.card{height:138px;border:1.5px solid var(--line);border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.card img{width:56px;height:56px;object-fit:cover;border-radius:50%}
.name{font:700 14px Georgia,serif;margin-top:3px}.desc{font-size:10px;line-height:1.15;margin-top:3px;color:#444}
.popular{margin-top:15px}.readers{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:0 23px}
.reader{height:130px;border:1.5px solid var(--line);border-radius:15px;text-align:center;padding:8px 2px}
.reader img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.rname{font-weight:700;font-size:11px;margin-top:4px}.rating{font-size:10px;margin-top:4px}.price{display:inline-block;border:1.5px solid var(--line);border-radius:12px;padding:3px 6px;color:var(--gold);font-size:9px}margin-top:5px}
.privacy{height:52px;margin:11px 23px;border:1.5px solid var(--line);border-radius:15px;background:#fffaf0;display:flex;align-items:center;padding:8px 13px;gap:9px;font-size:10px}
.privacy b{display:block;font-size:12px;margin-bottom:3px}.privacyIcon{font-size:27px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:60px;background:#fff;border-top:1px solid #eee;z-index:10}
.bottomIn{max-width:710px;margin:auto;height:100%;display:grid;grid-template-columns:repeat(4,1fr)}
.nav{border:0;background:#fff;color:#444;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav span{font-size:20px}.nav.active{color:var(--gold);font-weight:700}

@media (min-width:701px) and (max-width:710px){
  .page{width:710px;max-width:710px}
  .hero{width:664px;height:125px;margin-left:23px;margin-right:23px}
}
@media(min-width:711px){body{background:#fff}}

/* ORTALI / ORANTILI GÖRÜNÜM */
html,body{
  width:100%;
  min-width:0;
  margin:0;
  padding-left:0;
  padding-right:0;
  overflow-x:hidden;
}
.page{
  width:100%;
  max-width:710px;
  min-width:0;
  margin:0 auto !important;
}
.top{
  width:100%;
  margin:0 auto;
}
.hero,
.credit,
.privacy{
  box-sizing:border-box;
  max-width:664px;
  margin-left:auto !important;
  margin-right:auto !important;
}
.grid{
  width:100%;
  max-width:710px;
  margin-left:auto;
  margin-right:auto;
  padding-left:24px;
  padding-right:24px;
}
.section{
  max-width:710px;
  margin-left:auto;
  margin-right:auto;
}
.readers{
  width:100%;
  max-width:710px;
  margin-left:auto;
  margin-right:auto;
  padding-left:23px;
  padding-right:23px;
}
.bottomIn{
  width:100%;
  max-width:710px;
  margin:0 auto;
}
@media(max-width:500px){
  .top{padding-left:10px;padding-right:10px}
  .hero,.credit,.privacy{
    width:calc(100% - 28px);
  }
  .grid{
    padding-left:14px;
    padding-right:14px;
    gap:6px;
  }
  .readers{
    padding-left:14px;
    padding-right:14px;
    gap:6px;
  }
  .section{
    padding-left:14px;
    padding-right:14px;
  }
}

</style>
</head>
